background {
    monitor = DP-1
    path = screenshot
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.5172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

background {
    monitor = DP-3
    path = screenshot
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.5172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Day-Month-Date
label {
    monitor = DP-1
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, 185
    halign = center
    valign = center
}

# Time
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 100
    font_family = SF Pro Display Bold
    position = 0, 100
    halign = center
    valign = center
}

# USER
label {
    monitor = DP-1
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, -70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor = DP-1
    size = 300, 60

    outline_thickness = 0
    outer_color = rgba(216, 222, 233, 0.8)
    inner_color = rgba(255, 255, 255, 0.1)

    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    font_color = rgb(200, 200, 200)
    font_family = SF Pro Display Bold

    fade_on_empty = false
    placeholder_text =
    hide_input = false

    position = 0, -150
    halign = center
    valign = center
}
